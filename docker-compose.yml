services:
  propertyroi:
    build: .
    image: propertyroi:latest
    container_name: propertyroi
    ports:
      - "8000:8000"
    environment:
      # Data source: json (default, offline) | zillow | realtor | combined | rentcast
      PROPERTYROI_PROVIDER: "${PROPERTYROI_PROVIDER:-json}"
      # API keys for live providers (only needed if you switch provider).
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      RENTCAST_API_KEY: "${RENTCAST_API_KEY:-}"
      # MVBA tax-sale land: a county/MVBA listing page or JSON feed URL.
      MVBA_SALES_URL: "${MVBA_SALES_URL:-}"
      # HUD Fair Market Rents (free rental data): a free token from huduser.gov.
      HUD_API_TOKEN: "${HUD_API_TOKEN:-}"
      # CSV listings (no API key): path to a Redfin/Realtor export inside the
      # container. Mount your own CSV and point this at it, or use the bundled
      # sample at /app/data/sample_redfin.csv.
      PROPERTYROI_CSV: "${PROPERTYROI_CSV:-/app/data/sample_redfin.csv}"
      # Optional host overrides for the RapidAPI listings you subscribed to.
      ZILLOW_RAPIDAPI_HOST: "${ZILLOW_RAPIDAPI_HOST:-}"
      REALTOR_RAPIDAPI_HOST: "${REALTOR_RAPIDAPI_HOST:-}"
    restart: unless-stopped
