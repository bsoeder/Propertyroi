[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "propertyroi"
version = "0.1.0"
description = "Find for-sale properties, estimate rental potential from comps, rank by ROI, and measure estimator accuracy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PropertyROI contributors" }]
keywords = ["real-estate", "rental", "investment", "roi", "cap-rate", "cash-flow"]
dependencies = []  # standard library only

[project.scripts]
propertyroi = "propertyroi.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools]
packages = ["propertyroi", "propertyroi.providers"]

[tool.setuptools.package-data]
propertyroi = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, flake8-bugbear.
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length is enforced softly; long docstrings/tables are fine
    "E741",  # `l` is used deliberately as a short name for a Listing
]
